name: Publish site

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y doxygen cmake g++ ruby-full ruby-bundler

      - name: Build Doxygen
        run: |
          cmake -S . -B build \
            -DANPCPP_BUILD_DOCS=ON \
            -DANPCPP_BUILD_TESTS=OFF \
            -DANPCPP_BUILD_EXAMPLES=OFF
          cmake --build build --target anpcpp_docs

      - name: Stage API docs for Jekyll
        run: |
          rm -rf docs/site/api
          mkdir -p docs/site/api
          cp -a build/docs/html/. docs/site/api/

      - name: Stage README for Jekyll
        run: cp README.md docs/site/README.content.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        run: |
          cd docs/site
          bundle config set --local path vendor/bundle
          bundle install
          bundle exec jekyll build -d ../../_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
